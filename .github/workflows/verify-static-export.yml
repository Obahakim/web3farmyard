name: Verify static export

on:
  pull_request:
    branches: [main]
  push:
    branches: [security/server-side-admin-access]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPA_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPA_KEY: sb_publishable_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect dependency advisories
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const r=require('./npm-audit.json'); console.log(JSON.stringify({metadata:r.metadata?.vulnerabilities, advisories:Object.values(r.vulnerabilities||{}).map(v=>({name:v.name,severity:v.severity,isDirect:v.isDirect,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==='string'?x:{title:x.title,url:x.url,range:x.range})}))}, null, 2))"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: php -l api-proxy.php
      - run: npx tsc --noEmit
      - run: npm run build
