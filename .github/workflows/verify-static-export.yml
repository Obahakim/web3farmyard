name: Verify static export

on:
  pull_request:
    branches: [main]
  push:
    branches: [security/server-side-admin-access]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPA_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPA_KEY: sb_publishable_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: php -l api-proxy.php
      - run: npx tsc --noEmit
      - run: npm run build
