services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: deepn
      POSTGRES_PASSWORD: deepn
      POSTGRES_DB: deepn
    ports:
      - "5432:5432"
    volumes:
      - deepn-postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - deepn-minio:/data
volumes:
  deepn-postgres:
  deepn-minio:
